<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agin KK | Portfolio</title>
</head>

<body>

    <!-- Home Section -->
    <section id="home">
        <h1>Hi, I'm Agin KK</h1>
        <p>— Together We Grow —</p>
    </section>

    <hr>

    <!-- About Section -->
    <section id="about">
        <h2>About Me</h2>

        <p>A brief introduction:</p>

        <ul>
            <li>Tech Enthusiast</li>
            <li>Consistent Learner</li>
            <li>Passionate about Full Stack Development</li>
            <li>Always exploring new technologies and improving my skills</li>
        </ul>
    </section>

    <hr>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Get In Touch</h2>

        <p>Feel free to drop me a message:</p>

        <form action="#" method="post">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <br><br>

            <label for="message">Message:</label>
            <br>
            <textarea id="message" name="message"
                      rows="5" cols="30"
                      placeholder="Leave a message"></textarea>

            <br><br>

            <input type="submit" value="Send">

        </form>
    </section>

</body>

</html>
